AWSTemplateFormatVersion: "2010-09-09"

Transform: AWS::Serverless-2016-10-31

Description: CodeDynasty Full Serverless Backend Stack (with dead-letter queue, alarms, dashboard and change alerts)

Parameters:
  AlertEmail:
    Type: String
    Description: Where alarm and change notifications are emailed (confirm the SNS email once)

Globals:
  Function:
    Runtime: nodejs24.x

    Architectures:
      - x86_64

    Timeout: 30

    MemorySize: 256

    Environment:
      Variables:
        USERS_TABLE: !Ref UsersTable
        # Resolved from Secrets Manager at deploy time; the value is no longer in the repo.
        JWT_SECRET: !Sub "{{resolve:secretsmanager:${JwtSecret}:SecretString:jwtSecret}}"

Resources:
  # -------------------------
  # DynamoDB Users Table
  # -------------------------

  UsersTable:
    Type: AWS::DynamoDB::Table

    Properties:
      TableName: codedynasty-users-sam

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S

      KeySchema:
        - AttributeName: email
          KeyType: HASH

      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  # -------------------------
  # JWT Secret (random, generated by AWS)
  # -------------------------

  JwtSecret:
    Type: AWS::SecretsManager::Secret

    Properties:
      Name: codedynasty/sam/jwt-secret

      Description: JWT signing secret for CodeDynasty (login signs, listUsers verifies)

      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: jwtSecret
        PasswordLength: 48
        ExcludePunctuation: true

  # -------------------------
  # SQS Queue + Dead-letter queue
  # -------------------------

  SignupDLQ:
    Type: AWS::SQS::Queue

    Properties:
      QueueName: codedynasty-signup-dlq-sam

      MessageRetentionPeriod: 1209600 # 14 days to investigate and redrive

  SignupQueue:
    Type: AWS::SQS::Queue

    Properties:
      QueueName: codedynasty-signup-queue-sam

      VisibilityTimeout: 60

      # After 3 failed attempts a message moves to the DLQ instead of being lost
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SignupDLQ.Arn
        maxReceiveCount: 3

  # -------------------------
  # API Gateway
  # -------------------------

  CodeDynastyApi:
    Type: AWS::Serverless::Api

    Properties:
      Name: codedynasty-api

      StageName: prod

      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,OPTIONS'"

  # -------------------------
  # Signup Producer
  # -------------------------

  SignupProducerFunction:
    Type: AWS::Serverless::Function

    Properties:
      FunctionName: codedynasty-signup-producer

      CodeUri: functions/signupProducer/

      Handler: index.handler

      Environment:
        Variables:
          SQS_QUEUE_URL: !Ref SignupQueue

          USERS_TABLE: !Ref UsersTable

      Policies:
        # Allows sending signup messages to SQS
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SignupQueue.QueueName

        # Allows checking if email already exists
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable

      Events:
        SignupApi:
          Type: Api

          Properties:
            RestApiId: !Ref CodeDynastyApi

            Path: /signup

            Method: POST

  # -------------------------
  # Signup Worker
  # -------------------------

  SignupWorkerFunction:
    Type: AWS::Serverless::Function

    Properties:
      FunctionName: codedynasty-signup-worker

      CodeUri: functions/signupWorker/

      Handler: index.handler

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable

      Events:
        SignupQueueEvent:
          Type: SQS

          Properties:
            Queue: !GetAtt SignupQueue.Arn

            BatchSize: 10

  # -------------------------
  # Login Lambda
  # -------------------------

  LoginFunction:
    Type: AWS::Serverless::Function

    Properties:
      FunctionName: codedynasty-login

      CodeUri: functions/login/

      Handler: index.handler

      Environment:
        Variables:
          JWT_SECRET_ID: !Ref JwtSecret

      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable

        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref JwtSecret

      Events:
        LoginApi:
          Type: Api

          Properties:
            RestApiId: !Ref CodeDynastyApi

            Path: /login

            Method: POST

  # -------------------------
  # List Users Lambda
  # -------------------------

  ListUsersFunction:
    Type: AWS::Serverless::Function

    Properties:
      FunctionName: codedynasty-list-users

      CodeUri: functions/listUsers/

      Handler: index.handler

    
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable

      Events:
        UsersApi:
          Type: Api

          Properties:
            RestApiId: !Ref CodeDynastyApi

            Path: /users

            Method: GET

  # =========================================================
  # Monitoring
  # =========================================================

  # -------------------------
  # Alerts topic (email)
  # -------------------------

  AlertsTopic:
    Type: AWS::SNS::Topic

    Properties:
      TopicName: codedynasty-alerts

      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  AlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy

    Properties:
      Topics:
        - !Ref AlertsTopic

      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AlarmsAndEventBridgeCanPublish
            Effect: Allow
            Principal:
              Service:
                - cloudwatch.amazonaws.com
                - events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertsTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

          - Sid: AccountOwnerFullAccess
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - sns:Publish
              - sns:Subscribe
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:ListSubscriptionsByTopic
            Resource: !Ref AlertsTopic

  # -------------------------
  # Alarms (names match runbooks/signup-pipeline.md)
  # -------------------------

  SignupWorkerErrorAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmName: signup-worker-error-alarm
      AlarmDescription: Signup worker is failing; signups may be stuck. See runbooks/signup-pipeline.md
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SignupWorkerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  SignupProducerErrorAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmName: signup-producer-errors
      AlarmDescription: Signup API function is failing; new signups are being rejected
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SignupProducerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  LoginErrorAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmName: codedynasty-login-errors
      AlarmDescription: Login function is failing
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref LoginFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  QueueBacklogAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmName: codedynasty-queue-backlog-alarm
      AlarmDescription: Oldest signup message is over 5 minutes old; the worker is not keeping up or is stopped
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SignupQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 300
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  DlqNotEmptyAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmName: codedynasty-signup-dlq-not-empty
      AlarmDescription: Signups failed 3 times and are parked in the DLQ; investigate before redriving
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SignupDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:
      AlarmName: codedynasty-api-5xx
      AlarmDescription: API Gateway is returning server errors
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: codedynasty-api
        - Name: Stage
          Value: prod
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # -------------------------
  # EventBridge: alert on changes to the signup pipeline
  # (the kind of drift the runbook's CloudTrail step looks for)
  # -------------------------

  PipelineChangeRule:
    Type: AWS::Events::Rule

    Properties:
      Name: codedynasty-pipeline-change-alert
      Description: Email when someone changes the signup pipeline's Lambda, queue or IAM settings
      State: ENABLED
      EventPattern:
        detail-type:
          - AWS API Call via CloudTrail
        source:
          - aws.lambda
          - aws.sqs
          - aws.iam
        detail:
          eventName:
            - prefix: UpdateFunctionConfiguration
            - prefix: UpdateEventSourceMapping
            - prefix: DeleteEventSourceMapping
            - prefix: PutFunctionConcurrency
            - prefix: DeleteFunctionConcurrency
            - SetQueueAttributes
            - PurgeQueue
            - DeleteQueue
            - AttachRolePolicy
            - DetachRolePolicy
            - PutRolePolicy
            - DeleteRolePolicy
      Targets:
        - Id: email-alert
          Arn: !Ref AlertsTopic
          InputTransformer:
            InputPathsMap:
              event: $.detail.eventName
              who: $.detail.userIdentity.arn
              when: $.time
              region: $.region
            InputTemplate: '"CodeDynasty change: <event> by <who> at <when> (<region>). If this was not a deploy, check runbooks/signup-pipeline.md."'

  # -------------------------
  # Triage dashboard (named in the runbook)
  # -------------------------

  TriageDashboard:
    Type: AWS::CloudWatch::Dashboard

    Properties:
      DashboardName: codedynasty-triage
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
             "properties": {"title": "Lambda errors", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
               "metrics": [
                 ["AWS/Lambda", "Errors", "FunctionName", "${SignupProducerFunction}"],
                 ["...", "${SignupWorkerFunction}"],
                 ["...", "${LoginFunction}"],
                 ["...", "${ListUsersFunction}"]]}},
            {"type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
             "properties": {"title": "Lambda throttles", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
               "metrics": [
                 ["AWS/Lambda", "Throttles", "FunctionName", "${SignupProducerFunction}"],
                 ["...", "${SignupWorkerFunction}"],
                 ["...", "${LoginFunction}"],
                 ["...", "${ListUsersFunction}"]]}},
            {"type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
             "properties": {"title": "Signup queue and DLQ", "region": "${AWS::Region}", "stat": "Maximum", "period": 300, "view": "timeSeries",
               "metrics": [
                 ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${SignupQueue.QueueName}", {"label": "queue depth"}],
                 [".", "ApproximateAgeOfOldestMessage", ".", ".", {"label": "oldest message (s)", "yAxis": "right"}],
                 [".", "ApproximateNumberOfMessagesVisible", ".", "${SignupDLQ.QueueName}", {"label": "DLQ depth"}]]}},
            {"type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
             "properties": {"title": "API responses and latency", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
               "metrics": [
                 ["AWS/ApiGateway", "Count", "ApiName", "codedynasty-api", "Stage", "prod"],
                 [".", "4XXError", ".", ".", ".", "."],
                 [".", "5XXError", ".", ".", ".", "."],
                 [".", "Latency", ".", ".", ".", ".", {"stat": "p90", "yAxis": "right"}]]}},
            {"type": "metric", "x": 0, "y": 12, "width": 24, "height": 6,
             "properties": {"title": "DynamoDB users table", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries",
               "metrics": [
                 ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${UsersTable}"],
                 [".", "ConsumedReadCapacityUnits", ".", "."],
                 [".", "ThrottledRequests", ".", ".", "Operation", "PutItem"]]}}
          ]
        }

# -------------------------
# Outputs
# -------------------------

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint

    Value: !Sub "https://${CodeDynastyApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

  TableName:
    Value: !Ref UsersTable

  QueueName:
    Value: !GetAtt SignupQueue.QueueName

  DlqName:
    Value: !GetAtt SignupDLQ.QueueName

  AlertsTopicArn:
    Value: !Ref AlertsTopic

  DashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/codedynasty-triage"
